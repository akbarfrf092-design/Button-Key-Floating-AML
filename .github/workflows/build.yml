name: Button Key Floating Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ARMv7 AML plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-27" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Set NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_PATH"

      - name: Fetch official AML mod headers
        run: |
          git clone --depth 1 https://github.com/RusJJ/AndroidModLoader.git /tmp/AndroidModLoader
          rm -rf app/include/mod app/mod
          mkdir -p app/include/mod app/mod
          cp /tmp/AndroidModLoader/template_of_mod/mod/*.h app/include/mod/
          cp /tmp/AndroidModLoader/template_of_mod/mod/logger.cpp app/mod/
          cp -r /tmp/AndroidModLoader/template_of_mod/mod/thirdparty app/include/mod/
          echo "=== AML SDK files ==="
          find app/include/mod app/mod -maxdepth 3 -type f | sort

      - name: Verify Android NDK
        run: |
          "$ANDROID_NDK_HOME/ndk-build" --version

      - name: Build ARMv7
        run: |
          "$ANDROID_NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=app/Android.mk \
            NDK_APPLICATION_MK=app/Application.mk \
            V=1

      - name: Show build output
        run: |
          find . -type f -name "*.so" -print
          ls -lh libs/armeabi-v7a/

      - name: Upload ARMv7 library
        uses: actions/upload-artifact@v4
        with:
          name: Button-Key-Floating-armeabi-v7a
          path: libs/armeabi-v7a/*.so
